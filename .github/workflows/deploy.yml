name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://www.afore.it

      - name: Export static site
        run: npm run export
        env:
          NEXT_PUBLIC_BASE_URL: https://www.afore.it

      - name: Fix language route structure for S3
        run: |
          # For every .html file under out/<lang>/, create a matching directory
          # with index.html so S3 can serve clean URLs without extensions.
          # This handles ALL depth levels (e.g. /it/documentazione/certificati-spagna).
          for lang in it en es fr de; do
            if [ -d "out/$lang" ]; then
              # Create index.html for the language root (e.g. out/it/index.html)
              if [ -f "out/${lang}.html" ]; then
                mkdir -p "out/$lang"
                cp "out/${lang}.html" "out/$lang/index.html"
                echo "Created out/$lang/index.html"
              fi

              # Recursively find ALL .html files under out/<lang>/ and create
              # directory/index.html for each one (skipping existing index.html)
              find "out/$lang" -name '*.html' ! -name 'index.html' | while read html_file; do
                # Strip the .html extension to get the directory path
                dir_path="${html_file%.html}"
                mkdir -p "$dir_path"
                cp "$html_file" "$dir_path/index.html"
                echo "Created $dir_path/index.html"
              done
            fi
          done
          echo "✓ Fixed all language route structures for S3 (all depth levels)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

